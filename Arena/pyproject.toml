[project]
name = "arena"
version = "0.0.0"
description = "Arena Battle World: sinh tải, bơm lỗi, ghi lịch sử phía client, chấm bằng oracle"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6",
  "httpx>=0.27",
  "docker>=7.1",
  "confluent-kafka>=2.6",
  "aio-pika>=9.5",
  "boto3>=1.35",
]

[project.scripts]
arena = "arena.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "mypy>=1.13", "ruff>=0.8", "types-PyYAML>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*", "confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Chú thích tiếng Việt: bỏ cảnh báo ký tự unicode dễ nhầm.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
