# Hạ tầng dev MỘT NODE để bắt đầu code Block 4 ngay.
# Cụm chịu lỗi (Kafka 3 broker KRaft, RabbitMQ 3 node quorum, Redis Cluster 3+3) là hiện vật
# của Block 8 và Block 9: bạn tự viết vào compose.ha.yml, ghi rõ từng tham số và lý do.
name: scangrid-dev

services:
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  rabbitmq:
    image: rabbitmq:4.1-management
    ports: ["5672:5672", "15672:15672"]

  redis:
    image: redis:8.2
    # Vì sao noeviction cho kho trạng thái? Trả lời được câu Q5 trước khi sang Block 8.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]

  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    # TODO: rs.initiate() một lần (TTL index và change stream cần replica set).

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: scangrid
      POSTGRES_PASSWORD: scangrid
      POSTGRES_DB: scangrid
    ports: ["5432:5432"]

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3,sqs
    ports: ["4566:4566"]
