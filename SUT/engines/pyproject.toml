[project]
name = "scangrid-engines"
version = "0.0.0"
description = "Engine worker Python cho ScanGrid: YARA, Extractor, watcher cgroup (Block 3, 5)"
requires-python = ">=3.12"
dependencies = [
  "aio-pika>=9.5",
  "boto3>=1.35",
  "yara-python>=4.5",
  "python-magic>=0.4.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "mypy>=1.13", "ruff>=0.8", "boto3-stubs[s3]>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scangrid_engines"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["yara", "magic"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Chú thích tiếng Việt: bỏ cảnh báo ký tự unicode dễ nhầm.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
